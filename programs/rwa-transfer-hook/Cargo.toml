[package]
name = "rwa-transfer-hook"
version = "0.1.0"
description = "Token-2022 transfer hook enforcing on-chain KYC/jurisdiction/lockup compliance"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "rwa_transfer_hook"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", features = ["token_2022"] }
spl-transfer-hook-interface = "0.10.0"
spl-tlv-account-resolution = "0.10.0"
spl-discriminator = "0.4.1"
rwa-compliance = { path = "../rwa-compliance", features = ["cpi"] }

[dev-dependencies]

[profile.release]
overflow-checks = true
